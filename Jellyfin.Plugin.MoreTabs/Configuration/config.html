<div id="MoreTabsConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-controller="__plugin/MoreTabs.js">
    <div class="content-primary">
        <div class="verticalSection">
            <div class="sectionTitleContainer">
                <h2 class="sectionTitle">MoreTabs</h2>
            </div>
            <p>Add extra items next to Favourites, Movies, and Shows. Each item opens an in-app iframe of the URL you set.</p>
            <p>MoreTabs injects its own script into the web client. File Transformation 3.0 is optional extra coverage.</p>
            <p id="moreTabsStatus" class="fieldDescription">Checking injection...</p>
        </div>
        <form id="MoreTabsConfigForm">
            <div id="moreTabsList"></div>
            <div style="margin:1em 0;">
                <button is="emby-button" type="button" class="raised block" id="btnAddMoreTab">
                    <span>Add tab</span>
                </button>
            </div>
            <div>
                <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                    <span>Save</span>
                </button>
            </div>
        </form>
        <template id="moreTabTemplate">
            <div class="paperList" data-id="tab-row" style="padding:1em;margin-bottom:1em;">
                <div class="inputContainer">
                    <input is="emby-input" type="text" data-id="title" label="Title:" />
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="text" data-id="url" label="URL:" />
                    <div class="fieldDescription">https://example.com or a path on this server</div>
                </div>
                <div class="inputContainer">
                    <input is="emby-input" type="text" data-id="icon" label="Material icon:" />
                    <div class="fieldDescription">Optional. Leave blank for no icon. Examples: movie, live_tv, favorite</div>
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" data-id="enabled" />
                        <span>Enabled</span>
                    </label>
                </div>
                <input type="hidden" data-id="id" />
                <div style="display:flex;gap:0.5em;flex-wrap:wrap;">
                    <button is="emby-button" type="button" class="raised" data-id="move-up"><span>Up</span></button>
                    <button is="emby-button" type="button" class="raised" data-id="move-down"><span>Down</span></button>
                    <button is="emby-button" type="button" class="raised button-delete" data-id="remove"><span>Remove</span></button>
                </div>
            </div>
        </template>
    </div>
</div>
