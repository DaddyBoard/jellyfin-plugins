<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Custom Tabs JF12</title>
</head>
<body>
    <div id="customTabsJF12ConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="customTabsJF12ConfigForm">
                    <div class="verticalSection">
                        <h2>Custom Tabs JF12 Configuration</h2>
                        <p>Add custom tabs to the Jellyfin navigation bar. Each tab opens in an overlay iframe.</p>
                    </div>
                    
                    <div class="verticalSection">
                        <div id="tabsList"></div>
                        <button is="emby-button" type="button" class="raised button-submit block" id="addTabBtn">
                            <span>Add Tab</span>
                        </button>
                    </div>
                    
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="configPage.js"></script>
</body>
</html>
