<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Custom Tabs JF12</title>
</head>
<body>
    <div id="customTabsJF12ConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="customTabsJF12ConfigForm">
                    <div class="verticalSection">
                        <h2>Custom Tabs JF12 Configuration</h2>
                        <p>Add custom tabs to the Jellyfin navigation bar. Each tab opens in an overlay iframe.</p>
                    </div>
                    
                    <div class="verticalSection">
                        <h3>Configured Tabs</h3>
                        <div id="tabsConfigWrapper"></div>
                        <button is="emby-button" type="button" class="raised button-submit block" id="btnAddTab">
                            <span>Add Tab</span>
                        </button>
                    </div>
                    
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block" id="btnSave">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <template id="templateTabConfig">
            <div class="verticalSection" data-id="tab-config" style="border: 1px solid #333; padding: 1em; margin-bottom: 1em;">
                <div class="inputContainer">
                    <label class="inputLabel" for="txtTabTitle">Title:</label>
                    <input is="emby-input" type="text" data-id="txtTabTitle" class="emby-input" />
                    <div class="fieldDescription">The text shown on the navigation button.</div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel" for="txtTabUrl">URL:</label>
                    <input is="emby-input" type="text" data-id="txtTabUrl" class="emby-input" />
                    <div class="fieldDescription">The website to open in the overlay iframe.</div>
                </div>
                <div class="checkboxContainer">
                    <label>
                        <input is="emby-checkbox" type="checkbox" data-id="chkTabEnabled" />
                        <span>Enabled</span>
                    </label>
                </div>
                <button is="emby-button" type="button" class="raised button-cancel block" data-id="btnRemoveTab">
                    <span>Remove Tab</span>
                </button>
            </div>
        </template>

        <script type="text/javascript">
            if (typeof CustomTabsJF12Config == 'undefined') {
                const CustomTabsJF12Config = {
                    pluginId: "7c3f8a92-4b1d-4e8f-9a2c-5d6e7f8a9b0c",
                    configWrapper: document.querySelector("#tabsConfigWrapper"),
                    templateTabConfig: document.querySelector("#templateTabConfig"),
                    btnSave: document.querySelector("#btnSave"),
                    btnAddTab: document.querySelector("#btnAddTab"),

                    saveConfig: function (e) {
                        console.log('[CustomTabsJF12] Save button clicked');
                        e.preventDefault();
                        Dashboard.showLoadingMsg();
                        
                        const config = {
                            Tabs: []
                        };
                        
                        document.querySelectorAll("[data-id=tab-config]").forEach(tabConfig => {
                            const tab = {
                                Title: tabConfig.querySelector("[data-id=txtTabTitle]").value,
                                Url: tabConfig.querySelector("[data-id=txtTabUrl]").value,
                                Enabled: tabConfig.querySelector("[data-id=chkTabEnabled]").checked
                            };
                            
                            console.log('[CustomTabsJF12] Saving tab:', tab);
                            config.Tabs.push(tab);
                        });

                        console.log('[CustomTabsJF12] Saving configuration with', config.Tabs.length, 'tabs');
                        window.ApiClient.updatePluginConfiguration(CustomTabsJF12Config.pluginId, config)
                            .then(Dashboard.processPluginConfigurationUpdateResult)
                            .catch(function (error) {
                                console.error('[CustomTabsJF12] Error saving config:', error);
                            })
                            .finally(function () {
                                Dashboard.hideLoadingMsg();
                            });
                    },

                    loadConfig: function () {
                        console.log('[CustomTabsJF12] Loading configuration');
                        Dashboard.showLoadingMsg();
                        window.ApiClient.getPluginConfiguration(CustomTabsJF12Config.pluginId)
                            .then(function (config) {
                                console.log('[CustomTabsJF12] Loaded config with', (config.Tabs || []).length, 'tabs');
                                for (var i = 0; i < (config.Tabs || []).length; ++i) {
                                    CustomTabsJF12Config.addTabFromConfig(config.Tabs[i]);
                                }
                            })
                            .catch(function (error) {
                                console.error('[CustomTabsJF12] Error loading config:', error);
                            })
                            .finally(function () {
                                Dashboard.hideLoadingMsg();
                            });
                    },

                    init: function () {
                        console.log('[CustomTabsJF12] Initializing config page');
                        
                        CustomTabsJF12Config.btnAddTab.addEventListener("click", CustomTabsJF12Config.addNewTab);
                        console.log('[CustomTabsJF12] Add Tab button listener bound');
                        
                        CustomTabsJF12Config.btnSave.addEventListener("click", CustomTabsJF12Config.saveConfig);
                        console.log('[CustomTabsJF12] Save button listener bound');
                        
                        CustomTabsJF12Config.configWrapper.addEventListener("click", (event) => {
                            if (event.target.getAttribute('data-id') === "btnRemoveTab" || 
                                event.target.closest('[data-id="btnRemoveTab"]')) {
                                console.log('[CustomTabsJF12] Remove button clicked');
                                const el = event.target.closest("[data-id=tab-config]");
                                CustomTabsJF12Config.removeTab(el);
                            }
                        });
                        console.log('[CustomTabsJF12] Delegated remove handler bound');
                        
                        CustomTabsJF12Config.loadConfig();
                    },

                    addNewTab: function() {
                        console.log('[CustomTabsJF12] Add Tab clicked - cloning template');
                        const template = CustomTabsJF12Config.templateTabConfig.content.cloneNode(true);

                        template.querySelector('[data-id=txtTabTitle]').value = 'New Tab';
                        template.querySelector('[data-id=txtTabUrl]').value = 'https://example.com';
                        template.querySelector('[data-id=chkTabEnabled]').checked = true;

                        CustomTabsJF12Config.configWrapper.appendChild(template);
                        console.log('[CustomTabsJF12] New tab added to DOM');
                    },

                    addTabFromConfig: function(tabConfig) {
                        console.log('[CustomTabsJF12] Adding tab from config:', tabConfig.Title);
                        const template = CustomTabsJF12Config.templateTabConfig.content.cloneNode(true);
                        
                        template.querySelector('[data-id=txtTabTitle]').value = tabConfig.Title || '';
                        template.querySelector('[data-id=txtTabUrl]').value = tabConfig.Url || '';
                        template.querySelector('[data-id=chkTabEnabled]').checked = tabConfig.Enabled !== false;

                        CustomTabsJF12Config.configWrapper.appendChild(template);
                    },

                    removeTab: function(elem) {
                        console.log('[CustomTabsJF12] Removing tab');
                        elem.remove();
                    }
                };

                console.log('[CustomTabsJF12] Binding pageshow event to page element');
                document.querySelector('#customTabsJF12ConfigPage').addEventListener("pageshow", function () {
                    console.log('[CustomTabsJF12] pageshow event fired - calling init()');
                    CustomTabsJF12Config.init();
                });
            }
        </script>
    </div>
</body>
</html>
