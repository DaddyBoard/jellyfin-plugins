name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "manifest.json"
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin slug to release (e.g. "MoreTabs", "SonarrPlaceholder", "all", or "changed")
        required: false
        default: "changed"
      version:
        description: Plugin version such as 1.0.0.0 (optional)
        required: false
      changelog:
        description: Changelog shown in Jellyfin
        required: false
        default: Automated release

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect-plugins:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Detect plugins to release
        id: detect
        env:
          INPUT_PLUGIN: ${{ inputs.plugin }}
        run: |
          if [ "$INPUT_PLUGIN" = "all" ]; then
            PLUGINS=$(python3 .github/scripts/discover-plugins.py --json | jq -c .)
          elif [ -n "$INPUT_PLUGIN" ] && [ "$INPUT_PLUGIN" != "changed" ]; then
            PLUGINS=$(python3 .github/scripts/discover-plugins.py --json | jq -c --arg slug "$INPUT_PLUGIN" '[.[] | select(.slug == $slug)]')
          else
            PLUGINS=$(python3 .github/scripts/detect-changed-plugins.py | jq -c .)
          fi
          echo "matrix=$PLUGINS" >> "$GITHUB_OUTPUT"
          echo "Detected plugins to release:"
          echo "$PLUGINS" | jq -r '.[].name // empty'

  build:
    needs: detect-plugins
    if: needs.detect-plugins.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.detect-plugins.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PLUGIN_GUID: ${{ matrix.plugin.guid }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(python3 .github/scripts/next-version.py manifest.json "$PLUGIN_GUID")"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${{ matrix.plugin.slug }}-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish plugin
        env:
          CSPROJ: ${{ matrix.plugin.csproj }}
          VERSION: ${{ steps.version.outputs.value }}
        run: >
          dotnet publish "$CSPROJ"
          -c Release
          -o publish
          -p:Version="$VERSION"
          -p:AssemblyVersion="$VERSION"
          -p:FileVersion="$VERSION"

      - name: Package zip
        env:
          PLUGIN_SLUG: ${{ matrix.plugin.slug }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - <<'PY'
          import os
          import zipfile
          import hashlib
          from pathlib import Path
          plugin_slug = os.environ["PLUGIN_SLUG"]
          version = os.environ["VERSION"]
          zip_name = f"{plugin_slug}_{version}.zip"
          with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in Path("publish").glob("*.dll"):
                  archive.write(path, path.name)
          checksum = hashlib.md5(Path(zip_name).read_bytes()).hexdigest()
          print(f"Created {zip_name}")
          print(f"Checksum: {checksum}")
          with open("checksum.txt", "w") as f:
              f.write(checksum)
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_NAME: ${{ matrix.plugin.name }}
          PLUGIN_SLUG: ${{ matrix.plugin.slug }}
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANGELOG: ${{ inputs.changelog || github.event.head_commit.message || 'Automated release' }}
        run: |
          ZIP="${PLUGIN_SLUG}_${VERSION}.zip"
          gh release create "$TAG" "$ZIP" --title "$PLUGIN_NAME $VERSION" --notes "$CHANGELOG"

      - name: Prepare manifest metadata
        env:
          PLUGIN_SLUG: ${{ matrix.plugin.slug }}
          PLUGIN_NAME: ${{ matrix.plugin.name }}
          PLUGIN_GUID: ${{ matrix.plugin.guid }}
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          PLUGIN_METADATA: ${{ toJson(matrix.plugin) }}
        run: |
          SOURCE_URL="https://github.com/${REPO}/releases/download/${TAG}/${PLUGIN_SLUG}_${VERSION}.zip"
          CHECKSUM=$(cat checksum.txt)
          mkdir -p manifest-updates
          python3 - <<'PY'
          import os
          import json
          data = {
              "zip": f"{os.environ['PLUGIN_SLUG']}_{os.environ['VERSION']}.zip",
              "version": os.environ["VERSION"],
              "sourceUrl": os.environ["SOURCE_URL"],
              "guid": os.environ["PLUGIN_GUID"],
              "name": os.environ["PLUGIN_NAME"],
              "checksum": os.environ["CHECKSUM"],
              "metadata": json.loads(os.environ["PLUGIN_METADATA"])
          }
          with open(f"manifest-updates/{os.environ['PLUGIN_SLUG']}.json", "w") as f:
              json.dump(data, f, indent=2)
          PY

      - name: Upload manifest metadata
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.plugin.slug }}
          path: manifest-updates/${{ matrix.plugin.slug }}.json

  update-manifest:
    needs: [detect-plugins, build]
    if: needs.detect-plugins.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Download all manifest metadata
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: manifest-updates

      - name: Update manifest for all plugins
        env:
          CHANGELOG: ${{ inputs.changelog || github.event.head_commit.message || 'Automated release' }}
        run: |
          for metadata_file in manifest-updates/manifest-*/*.json; do
            ZIP=$(jq -r '.zip' "$metadata_file")
            VERSION=$(jq -r '.version' "$metadata_file")
            SOURCE_URL=$(jq -r '.sourceUrl' "$metadata_file")
            GUID=$(jq -r '.guid' "$metadata_file")
            NAME=$(jq -r '.name' "$metadata_file")
            CHECKSUM=$(jq -r '.checksum' "$metadata_file")
            METADATA=$(jq -c '.metadata' "$metadata_file")
            
            echo "Updating manifest for $NAME ($VERSION) with checksum $CHECKSUM"
            
            python3 .github/scripts/update-manifest.py \
              "$ZIP" \
              "$VERSION" \
              "$SOURCE_URL" \
              "$GUID" \
              "$NAME" \
              "$CHECKSUM" \
              "$METADATA"
          done

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi
          
          PLUGINS=$(ls manifest-updates/manifest-*/*.json | wc -l)
          if [ "$PLUGINS" -eq 1 ]; then
            NAME=$(jq -r '.name' manifest-updates/manifest-*/*.json)
            VERSION=$(jq -r '.version' manifest-updates/manifest-*/*.json)
            git commit -m "chore: publish $NAME $VERSION"
          else
            git commit -m "chore: publish $PLUGINS plugins"
          fi
          
          git push
